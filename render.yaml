services:
  - type: web
    name: fliplens-api
    runtime: python
    # Free instance: no card needed, sleeps after 15 min idle (~1 min to wake).
    # Change to a paid plan (e.g. 0.5c-512mb) when you start charging users.
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_NAME
        value: FlipLens AI
      - key: APP_VERSION
        value: 1.6.0
      - key: AI_PROVIDER
        value: gemini
      - key: PRICING_PROVIDER
        value: ebay
      - key: FREE_DAILY_LIMIT
        value: "5"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
